<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- IBM Blue gradient background -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F62FE;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0F62FE;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#blueGradient)"/>
  
  <!-- Stopwatch icon (simplified) -->
  <g transform="translate(320, 200)">
    <!-- Outer circle -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#0F62FE" stroke-width="8"/>
    <!-- Inner circle -->
    <circle cx="80" cy="80" r="60" fill="none" stroke="#0F62FE" stroke-width="4"/>
    <!-- Clock hands -->
    <line x1="80" y1="80" x2="80" y2="40" stroke="#0F62FE" stroke-width="6" stroke-linecap="round"/>
    <line x1="80" y1="80" x2="110" y2="80" stroke="#0F62FE" stroke-width="4" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="80" cy="80" r="6" fill="#0F62FE"/>
    <!-- Top button -->
    <rect x="70" y="10" width="20" height="15" rx="3" fill="#0F62FE"/>
  </g>
  
  <!-- OnboardOps wordmark -->
  <text x="640" y="280" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="96" font-weight="bold" fill="#161616" text-anchor="middle">
    OnboardOps
  </text>
  
  <!-- Tagline -->
  <text x="640" y="360" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="42" fill="#6F6F6F" text-anchor="middle" font-style="italic">
    The 10-Minute Repo Whisperer
  </text>
  
  <!-- Decorative line -->
  <line x1="400" y1="400" x2="880" y2="400" stroke="#0F62FE" stroke-width="3" opacity="0.3"/>
  
  <!-- Subtitle -->
  <text x="640" y="480" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="32" fill="#161616" text-anchor="middle">
    AI-Powered Onboarding in Under 10 Minutes
  </text>
  
  <!-- Feature highlights -->
  <g transform="translate(240, 540)">
    <!-- Feature 1 -->
    <circle cx="20" cy="0" r="8" fill="#24A148"/>
    <text x="40" y="8" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" fill="#161616">
      Socratic Guidance
    </text>
    
    <!-- Feature 2 -->
    <circle cx="280" cy="0" r="8" fill="#24A148"/>
    <text x="300" y="8" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" fill="#161616">
      Auto-Recovery
    </text>
    
    <!-- Feature 3 -->
    <circle cx="520" cy="0" r="8" fill="#24A148"/>
    <text x="540" y="8" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" fill="#161616">
      Certification
    </text>
    
    <!-- Feature 4 -->
    <circle cx="720" cy="0" r="8" fill="#24A148"/>
    <text x="740" y="8" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="24" fill="#161616">
      Starter PR
    </text>
  </g>
  
  <!-- Footer -->
  <text x="640" y="660" font-family="'IBM Plex Sans', Arial, sans-serif" font-size="20" fill="#6F6F6F" text-anchor="middle">
    Built with IBM Bob IDE • Hackathon 2026
  </text>
</svg>

<!-- Made with Bob -->
