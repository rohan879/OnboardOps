name: OnboardOps CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Skip CI if commit message contains [skip ci], [ci skip], [no ci], or [skip actions]
# Usage: git commit -m "docs: Update README [skip ci]"

jobs:
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy
      
      - name: Lint with ruff
        run: |
          cd backend
          ruff check . --output-format=github
      
      - name: Type check with mypy
        run: |
          cd backend
          mypy . --ignore-missing-imports || true
        continue-on-error: true  # Don't fail on type errors in Phase 1
      
      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-${{ matrix.python-version }}
        continue-on-error: true  # Don't fail if Codecov is down

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      
      - name: Install dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile
      
      - name: Lint
        run: |
          cd frontend
          pnpm lint
      
      - name: Type check
        run: |
          cd frontend
          pnpm tsc --noEmit
      
      - name: Run tests
        run: |
          cd frontend
          pnpm test --run
        continue-on-error: true  # Tests may not exist in Phase 1
      
      - name: Build
        run: |
          cd frontend
          pnpm build
      
      - name: Check bundle size
        run: |
          cd frontend
          du -sh .next/ || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      
      - name: Install all dependencies
        run: |
          # Backend
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd ..
          
          # Frontend
          cd frontend
          pnpm install --frozen-lockfile
          cd ..
      
      - name: Run E2E smoke test
        run: |
          chmod +x scripts/e2e-smoke.sh
          ./scripts/e2e-smoke.sh || true
        continue-on-error: true  # E2E may not be ready in Phase 1
        timeout-minutes: 5

  lint-docs:
    name: Documentation Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check markdown files
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: |
            **/*.md
            !node_modules
            !.next
        continue-on-error: true  # Don't fail on markdown lint in Phase 1
      
      - name: Check for broken links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check-config.json'
        continue-on-error: true  # Don't fail on broken links in Phase 1

  pii-check:
    name: PII/Secret Check (Bob Sessions)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check bob_sessions for unscrubbed secrets
        run: |
          if [ -d "bob_sessions" ]; then
            echo "Checking bob_sessions/ for unscrubbed secrets..."
            python3 scripts/scrub.py --check bob_sessions/
            if [ $? -ne 0 ]; then
              echo "❌ FAIL: Unscrubbed secrets found in bob_sessions/"
              echo "Run: python3 scripts/scrub.py --dir bob_sessions/ --output bob_sessions/"
              exit 1
            fi
            echo "✅ PASS: No unscrubbed secrets found"
          else
            echo "⚠️ bob_sessions/ directory not found, skipping check"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [secrets, backend, frontend, integration, pii-check]
    if: always()
    
    steps:
      - name: Check job statuses
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scanning | ${{ needs.secrets.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Tests | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.secrets.result }}" == "failure" ]]; then
            echo "⚠️ **Secret scanning failed!** Review gitleaks output immediately." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          if [[ "${{ needs.backend.result }}" == "failure" ]] || [[ "${{ needs.frontend.result }}" == "failure" ]]; then
            echo "⚠️ **Build failed.** Review logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "✅ **All critical checks passed!**" >> $GITHUB_STEP_SUMMARY

# Made with Bob
